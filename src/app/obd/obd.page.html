
<ion-header >
  
  <ion-toolbar >
    <ion-title > CarBox </ion-title>
    <ion-buttons slot="start">
      <ion-back-button text=""></ion-back-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)" pullMin="100" pullMax="200">
    <ion-refresher-content
    pullingIcon="arrow-down-outline" 
    refreshingSpinner="crescent"></ion-refresher-content>
  </ion-refresher>
  <ion-item >
    <ion-label>Niveau d'essence</ion-label>
    <ion-note slot="end" color="success">{{dataOBD.essence}} %</ion-note>
  </ion-item>

  <ion-item>
    <ion-label>Tension batterie</ion-label>
    <ion-note slot="end" color="success">{{dataOBD.batterie}} V</ion-note>
  </ion-item>
  <ion-item>
    <ion-label>Kilométrage</ion-label>
    <ion-note slot="end" color="primary">{{dataOBD.kilometrage}} km</ion-note>
  </ion-item>

  <ion-item  button [routerLink]="['/obderrorcode']" routerDirection="forward" id ="buttonErrorCode">
    <ion-label>Codes défauts</ion-label>
    <ion-note slot="end" color="danger" id="noteErrorCode">{{dataOBD.nbcodeerr}}</ion-note>
  </ion-item>
  <ion-item>
    <ion-label>Vitesse</ion-label>
    <ion-note slot="end" color="primary">{{dataOBD.vitesse}} (rpm)</ion-note>
  </ion-item>

  <ion-item>
    <ion-label>Centralisation</ion-label>
    <ion-note slot="end" color="success">{{dataOBD.centralisation}}</ion-note>
  </ion-item>

 
</ion-content>
