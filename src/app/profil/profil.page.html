  <!--Menu-->
<ion-menu type="reveal" menuId="menu" side="end" swipeGesture="false" content-id="main-content">
  <ion-header >
    <ion-toolbar >
      <ion-title>Loopers</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item button [routerLink]="['/about']" routerDirection="forward">
        <ion-icon name="information-circle-outline" slot="start"></ion-icon>
        <ion-label>A propos</ion-label>
      </ion-item>
      <ion-item button [routerLink]="['/help']" routerDirection="forward">
        <ion-icon name="help-circle-outline" slot="start"></ion-icon>
        <ion-label>Aide</ion-label>
      </ion-item>
 <ion-item button [routerLink]="['/obd']" routerDirection="forward" id ="buttonOBD">
  <ion-icon  name="stats-chart-outline" slot="start"></ion-icon>
        <ion-label id="CarBox">CarBox</ion-label>
      </ion-item>
      <ion-item button [routerLink]="['/settings']" routerDirection="forward"> 
        <ion-icon name="cog-outline" slot="start"></ion-icon>
        <ion-label>Paramètres</ion-label>
      </ion-item>
      <ion-item (click)="logout()">
          <ion-icon  slot="start" name="log-out-outline"></ion-icon>
          <ion-label >Déconnexion</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div  id="main-content">
  <ion-header >
    <ion-toolbar>
      <ion-button fill="clear">
        <ion-icon slot="start" name="key-outline"></ion-icon>
    </ion-button>
      <ion-buttons  slot="end">
        <ion-menu-button></ion-menu-button>
    </ion-buttons>
    </ion-toolbar>
  </ion-header>
  

<ion-content [fullscreen]="true">
  <ion-row> 
      <ion-avatar *ngFor="let image of imagesP" class="img-box">
        <img [src]="image.url" alt="profil">
      </ion-avatar>
      
  </ion-row>
  <ion-row>
    <ion-col class='textC'>
     <h3> {{dataUser.prenom}} {{dataUser.nom}}</h3>
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class='textC'>
     {{dataUser.ville}}, {{dataUser.pays}}
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col class='textC'>
     {{dataUser.description}}
    </ion-col>
  </ion-row>
  <ion-row>
    <ion-col size="6">
      <ion-button expand="block" color="light">Mon Crew</ion-button>
    </ion-col>

    <ion-col size="6">
      <ion-button expand="block" color="light">Editer mon profil</ion-button>
    </ion-col>


  </ion-row>
  <ion-row>
  Vous utilisez votre :
  </ion-row>

  <ion-row>
    <ion-col size="12">
      <ion-item>
        <ion-thumbnail *ngFor="let image of imagesV" slot="end">
          <ion-img [src]="image.url" alt="voiture"></ion-img>
        </ion-thumbnail>
        <ion-label>
          BMW SERIE 1
        </ion-label>
      </ion-item>
    </ion-col>
  
</ion-row>
</ion-content>
</div>
