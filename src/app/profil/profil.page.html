  <!--Menu-->
<ion-menu type="reveal" menuId="menu" side="end" swipeGesture="false" content-id="main-content">
  <ion-header>
    <ion-toolbar translucent>
      <ion-title>Loopers</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item>
        <ion-icon name="information-circle-outline" slot="start"></ion-icon>
        <ion-label>A propos</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="help-circle-outline" slot="start"></ion-icon>
        <ion-label>Aide</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="archive" slot="start"></ion-icon>
        <ion-label>Archived</ion-label>
      </ion-item>
      <ion-item>
        <ion-icon name="cog-outline" slot="start"></ion-icon>
        <ion-label>Paramètres</ion-label>
      </ion-item>
      <ion-item (click)="logout()">
          <ion-icon  slot="start" name="log-out-outline"></ion-icon>
          <ion-label >Déconnexion</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-header >
    <ion-toolbar>
      <ion-title > {{dataUser.prenom}} {{dataUser.nom}} </ion-title>
      <ion-buttons  slot="end">
        <ion-menu-button></ion-menu-button>
    </ion-buttons>
    </ion-toolbar>
  </ion-header>


<ion-content [fullscreen]="true">

</ion-content>
</div>
