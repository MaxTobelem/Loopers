
<ion-header >
  
  <ion-toolbar >
    <ion-title > Mon garage  </ion-title>
    <ion-buttons slot="start">
      <ion-back-button text=""></ion-back-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row>
    <ion-col size="12">
    <ion-list>
      <ion-item  *ngFor="let string of carlist; let i = index">
        {{carlist[i]}}
      </ion-item>
    </ion-list>
  </ion-col>
  </ion-row>
  
  <ion-row>
    <ion-col size="12">
      <ion-button [routerLink]="['/carinscription']" routerDirection="forward" expand="block" color="light">Ajouter un véhicule</ion-button>
    </ion-col>
  </ion-row>
</ion-content>
