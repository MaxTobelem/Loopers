<ion-header >
  <ion-toolbar>
    <ion-title>
      Confirmation réinitialisation mot de passe
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content scrollX=false scrollY=false [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        <div style="white-space: normal;">
          Mot de passe oublié ? 
        </div>
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-item class="phrase"><p>Remplissez le formulaire ci-dessous pour vous créer un nouveau mot de passe.</p></ion-item>
  
  <form [formGroup]="frmSetNewPassword" (ngSubmit)="setPassword()">
    <ion-item>
      <ion-label position="floating">Mot de passe</ion-label>
      <ion-input formControlName="password" inputmode="password"  name="password" type=password ></ion-input>
    </ion-item>
    <div *ngFor="let error of errorMessages.password">
      <ng-container *ngIf="password.hasError(error.type) && (password.dirty || password.touched)">
        <small class="error-message">{{error.message}}</small>
      </ng-container>
    </div>
    
    <ion-item>
      <ion-label position="floating">Confirmation</ion-label>
      <ion-input formControlName="confirmpassword" inputmode="password"  type=password ></ion-input>
    </ion-item>
    <div *ngFor="let error of errorMessages.confirmpassword">
      <ng-container *ngIf="confirmpassword.hasError(error.type) && (confirmpassword.dirty || confirmpassword.touched)">
        <small class="error-message">{{error.message}}</small>
      </ng-container>
    </div>
    <small class="error-message" *ngIf="!registrationForm.get('confirmpassword').errors && registrationForm.hasError('passwordMismatch') && (registrationForm.get('confirmpassword').dirty || registrationForm.get('confirmpassword').touched)">
      Les mots de passe ne correspondent pas
    </small>
 
  <br>  <br>
  <ion-button  color="dark" [disabled]="!frmSetNewPassword.valid" type="submit" expand="block" shape="round" >Confirmer</ion-button>
</form>


</ion-content>
