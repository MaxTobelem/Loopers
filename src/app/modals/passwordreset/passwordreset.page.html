<ion-header >
  <ion-toolbar>
    <ion-title>
      Réinitialisation mot de passe
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content scrollX=false scrollY=false [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        <div style="white-space: normal;">
          Mot de passe oublié ? 
        </div>
      </ion-title>
      <!-- <ion-buttons  slot="end">
        <ion-button color="light" (click)="closeModal()">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button> 
    </ion-buttons> -->
    </ion-toolbar>
  </ion-header>
  <ion-item class="phrase"><p>Remplissez le formulaire ci-dessous et nous vous enverrons par e-mail les informations pour vous créer un nouveau mot de passe.</p></ion-item>

  <form [formGroup]="registrationForm" (ngSubmit)="submit()">

  <ion-item>
    <ion-label position="floating">E-mail</ion-label>
    <ion-input formControlName="email" inputmode="mail" type="email" ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.mail">
    <ng-container *ngIf="mail.hasError(error.type) && (mail.dirty || mail.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>

  <br>  <br>
  <ion-button  color="dark" [disabled]="!registrationForm.valid" type="submit" expand="block" shape="round" >Confirmer</ion-button>
  
</form>

</ion-content>
