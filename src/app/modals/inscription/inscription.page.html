<ion-header >
  <ion-toolbar>
    <ion-title>
      Inscription
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content scrollX=false scrollY=false [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inscription</ion-title>
      <!-- <ion-buttons  slot="end">
        <ion-button color="light" (click)="closeModal()">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button> 
    </ion-buttons> -->
    </ion-toolbar>
  </ion-header>

  <form [formGroup]="registrationForm" (ngSubmit)="submit()">

  <ion-item>
    <ion-label position="floating">Prénom</ion-label>
    <ion-input formControlName="prenom" inputmode="text"  ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.prenom">
    <ng-container *ngIf="prenom.hasError(error.type) && (prenom.dirty || prenom.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>
  
  <ion-item>
    <ion-label position="floating">Nom</ion-label>
    <ion-input autocapitalize formControlName="nom" inputmode="text"  ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.nom">
    <ng-container *ngIf="nom.hasError(error.type) && (nom.dirty || nom.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>

  <ion-item>
    <ion-label position="floating">Pseudo</ion-label>
    <ion-input formControlName="pseudo" inputmode="text"  ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.pseudo">
    <ng-container *ngIf="pseudo.hasError(error.type) && (pseudo.dirty || pseudo.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>

  <ion-item>
    <ion-label position="floating">E-mail</ion-label>
    <ion-input formControlName="email" inputmode="mail" type="email" ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.mail">
    <ng-container *ngIf="mail.hasError(error.type) && (mail.dirty || mail.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>

  <ion-item>
    <ion-label position="floating">Mot de passe</ion-label>
    <ion-input formControlName="password" inputmode="password"  type=password ></ion-input>
  </ion-item>
  <div *ngFor="let error of errorMessages.password">
    <ng-container *ngIf="password.hasError(error.type) && (password.dirty || password.touched)">
      <small class="error-message">{{error.message}}</small>
    </ng-container>
  </div>
  <br>  <br>
  <ion-button  color="dark" [disabled]="!registrationForm.valid" type="submit" expand="block" shape="round" >S'inscrire</ion-button>
  
</form>

</ion-content>
